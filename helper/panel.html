<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Помощник АЛЬФАПРОМ</title><style>body{font:16px/1.6 system-ui;background:#f5f6f8;color:#20252b;padding:30px;max-width:720px;margin:auto}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:28px}h1{font-size:23px}button{padding:10px 15px;border:1px solid #ddd;border-radius:7px;background:white;font:inherit;cursor:pointer}.muted{color:#68717c;font-size:14px}#status{padding:18px;background:#fff3dc;border-radius:8px;margin:20px 0}[hidden]{display:none!important}</style></head><body><div class="card"><h1>Помощник АЛЬФАПРОМ активирован</h1><div id="status" role="status">Готов к работе со студией.</div><p class="muted">Доработка, прогресс и результат теперь отображаются прямо в Quality Engine. Отдельное окно помощника открывать не требуется.</p><button id="cancel" disabled>Остановить доработку</button> <button id="download" hidden>Скачать результат HTML</button></div><script>
// Credentials stay in the loopback frame. The parent receives only lifecycle events and final HTML.
const session=__SESSION_JSON__,parents=__PARENTS_JSON__;
const peer=window.parent!==window?window.parent:window.opener;
let job=null,result='',poll=null,origin=null,checking=false;
const status=document.getElementById('status'),cancel=document.getElementById('cancel');
function send(data){if(peer&&origin)peer.postMessage(data,origin)}
async function post(path,data){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Alfaprom-Session':session},body:JSON.stringify(data)});const body=await response.json();if(!response.ok)throw new Error(body.error||'Помощник не смог завершить запрос');return body}
async function heartbeat(){if(checking)return;checking=true;try{const r=await fetch('/health',{cache:'no-store',signal:AbortSignal.timeout(4000)}),data=await r.json();if(data.service!=='alfaprom-seo-helper'||data.version<3)throw Error('Обновите помощника');send({type:'alfaprom.helper.ready',version:data.version})}catch(e){send({type:'alfaprom.helper.offline'})}finally{checking=false}}
async function progress(){const active=job;if(!active)return;try{const data=await post('/progress',{jobId:active.id});if(job===active)send({type:'alfaprom.revision.progress',jobId:active.id,...data})}catch(e){/* heartbeat detects a stopped service; the result request reports job errors */}}
async function stopJob(){if(!job)return;cancel.disabled=true;status.textContent='Останавливаю доработку…';try{await post('/cancel',{jobId:job.id})}catch(e){send({type:'alfaprom.revision.error',jobId:job.id,error:'Нет связи с помощником. Остановите его через меню α SEO.'})}}
window.addEventListener('message',async event=>{
 if(!parents.includes(event.origin)||event.source!==peer||!event.data)return;
 origin=event.origin;
 if(event.data.type==='alfaprom.helper.ping'){heartbeat();return}
 if(event.data.type==='alfaprom.cancel'&&event.data.jobId===job?.id){stopJob();return}
 if(event.data.type!=='alfaprom.revise'||job||typeof event.data.jobId!=='string'||typeof event.data.prompt!=='string')return;
 const active={id:event.data.jobId};job=active;status.textContent='Выполняется доработка…';cancel.disabled=false;
 poll=setInterval(progress,1000);
 try{const data=await post('/revise',{jobId:active.id,prompt:event.data.prompt});result=data.html;status.textContent='Доработка завершена. Результат передан в студию.';document.getElementById('download').hidden=false;send({type:'alfaprom.revision.result',jobId:active.id,html:result})}
 catch(error){status.textContent=error.message;send({type:'alfaprom.revision.error',jobId:active.id,error:error.message})}
 finally{clearInterval(poll);job=null;cancel.disabled=true}
});
cancel.onclick=stopJob;
document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([result],{type:'text/html'})),link=document.createElement('a');link.href=url;link.download='article-improved.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('pagehide',()=>{if(job)fetch('/cancel',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Alfaprom-Session':session},body:JSON.stringify({jobId:job.id})}).catch(()=>{})});
for(const target of parents)if(peer)peer.postMessage({type:'alfaprom.helper.ready',version:3},target);
</script></body></html>
